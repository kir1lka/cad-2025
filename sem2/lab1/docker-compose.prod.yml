services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: raspisa
      POSTGRES_USER: raspisa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raspisa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raspisa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/raspisa
      DB_USERNAME: raspisa
      DB_PASSWORD: ${DB_PASSWORD:-raspisa}
      SERVER_PORT: 8080
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      REMINDER_CRON: ${REMINDER_CRON:-0 0 8 * * *}
      REMINDER_ZONE: ${REMINDER_ZONE:-Europe/Moscow}
    expose:
      - "8080"         
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"      
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data    
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
