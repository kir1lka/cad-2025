server:
  port: ${SERVER_PORT:8083}
  servlet:
    session:
      cookie:
        name: RASPISA_LAB3_SESSION
        http-only: true
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/raspisa-lab3;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update        
    show-sql: true              
    properties:
      hibernate:
        format_sql: true      

push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@raspisa.local}

  reminder:
    cron: ${REMINDER_CRON:0 0 8 * * *}
    zone: ${REMINDER_ZONE:Europe/Moscow}
